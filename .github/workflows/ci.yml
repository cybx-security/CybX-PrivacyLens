name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "17 8 * * 1"
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race ./...
  # Runs the real installer on each OS (the hosted runners are elevated),
  # then checks the result with "status" and removes it again. This is the
  # only place the Windows install path — Program Files, ACLs, scheduled
  # task, shortcut, Installed-apps entry — is exercised end to end.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - name: Build
        shell: bash
        run: |
          mkdir pkg
          go build -o pkg/privacylens${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/privacylens
          go build -o pkg/privacylens-gui${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/privacylens-gui
      - name: Install, check, scan, uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Check($what) { if ($LASTEXITCODE -ne 0) { throw "$what failed with exit code $LASTEXITCODE" } }
          ./pkg/privacylens.exe install -no-ocr; Check 'install'
          $exe = "$env:ProgramFiles\PrivacyLens\privacylens.exe"
          & $exe status; Check 'status'
          if (-not (Test-Path "$env:ProgramFiles\PrivacyLens\privacylens-gui.exe")) { throw 'GUI launcher not installed' }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\PrivacyLens.lnk")) { throw 'Start Menu shortcut missing' }
          if (-not (Test-Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PrivacyLens')) { throw 'Installed-apps entry missing' }
          schtasks /Query /TN "PrivacyLens Scan"; Check 'scheduled task query'
          & $exe -quiet testdata
          if ($LASTEXITCODE -ne 1) { throw "scan of testdata should exit 1 (PII found), got $LASTEXITCODE" }
          if (-not (Select-String -Path "$env:ProgramData\PrivacyLens\logs\findings.json" -Pattern 'scan_summary' -Quiet)) { throw 'scan did not reach the machine-wide findings log' }
          & $exe uninstall -purge; Check 'uninstall'
          Start-Sleep -Seconds 10
          if (Test-Path "$env:ProgramFiles\PrivacyLens") { throw 'program folder not removed' }
          if (Test-Path "$env:ProgramData\PrivacyLens") { throw 'data folder not purged' }
      # The same again through the setup wizard, silently - what a customer
      # (or an RMM) actually runs. The runner image does not ship NSIS.
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed with exit code $LASTEXITCODE" }
          Add-Content -Path $env:GITHUB_PATH -Value "${env:ProgramFiles(x86)}\NSIS"
      - name: Setup wizard - silent install and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path pkg).Path
          $out = Join-Path $src 'PrivacyLens-Setup.exe'
          & makensis /V2 /DVERSION=0.0.1 "/DSRC_AMD64=$src" "/DSRC_ARM64=$src" "/DGUIDE=$PWD\docs\PrivacyLens-User-Guide.docx" "/DICON=$PWD\packaging\icon\icon.ico" "/DOUTFILE=$out" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          $p = Start-Process -FilePath $out -ArgumentList '/S','/NOOCR' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent setup exited with $($p.ExitCode)" }
          $dir = "$env:ProgramFiles\PrivacyLens"
          foreach ($f in 'privacylens.exe','privacylens-gui.exe','Uninstall.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "$f not installed" }
          }
          & "$dir\privacylens.exe" status
          if ($LASTEXITCODE -ne 0) { throw "status reported problems after setup" }
          $key = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PrivacyLens'
          $un = (Get-ItemProperty $key).UninstallString
          if ($un -notlike '*Uninstall.exe*') { throw "Installed-apps entry should use the wizard uninstaller, got: $un" }
          # _?= makes the NSIS uninstaller run in place so -Wait really waits.
          $p = Start-Process -FilePath "$dir\Uninstall.exe" -ArgumentList '/S','/PURGE',"_?=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent uninstall exited with $($p.ExitCode)" }
          Start-Sleep -Seconds 10
          if (Test-Path "$dir\privacylens.exe") { throw 'program not removed by the uninstaller' }
          if (Test-Path $key) { throw 'Installed-apps entry not removed' }
          if (Test-Path "$env:ProgramData\PrivacyLens") { throw 'data folder not purged' }
      - name: Install, check, scan, uninstall (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          set -eux
          sudo ./pkg/privacylens install -no-ocr
          /usr/local/bin/privacylens status
          sudo /usr/local/bin/privacylens -quiet testdata && exit 1 || [ $? -eq 1 ]
          sudo grep -q scan_summary /var/log/privacylens/findings.json
          sudo /usr/local/bin/privacylens uninstall -purge
          [ ! -e /usr/local/bin/privacylens ]
          [ ! -e /etc/privacylens ]
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      - run: go test -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: ./scripts/build-all.sh
      - run: test -f dist/packages/PrivacyLens-Setup-*.exe
      - run: sha256sum dist/privacylens-* dist/packages/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-candidates
          path: dist/
          retention-days: 7
