name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - run: go test ./...
      - run: ./scripts/build-all.sh
      - name: Generate SBOM
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          cyclonedx-gomod mod -json -output dist/sbom.cdx.json
      - name: Write checksums and build metadata
        run: |
          find dist -type f -maxdepth 4 -print0 | sort -z | xargs -0 shasum -a 256 > dist/SHA256SUMS
          go version > dist/BUILD-INFO.txt
          go list -m all >> dist/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidates
          path: dist/
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SHA256SUMS
            dist/BUILD-INFO.txt
            dist/sbom.cdx.json
            dist/privacylens-*
            dist/packages/*
          generate_release_notes: true
          draft: true
