<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrivacyLens v__VERSION__</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c2733; --muted: #66727f;
    --accent: #0b5fff; --line: #e3e7ec;
    --high: #c62828; --medium: #ef6c00; --low: #607d8b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--ink); color: #fff; padding: 22px 32px; display: flex; align-items: baseline; gap: 14px; }
  header h1 { margin: 0; font-size: 20px; }
  header .sub { color: #aab6c2; font-size: 13px; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 32px 64px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 22px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 4px; }
  textarea, input[type=text], input[type=number], select { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; }
  textarea { font-family: ui-monospace, Menlo, monospace; font-size: 13px; resize: vertical; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; }
  .row > div { flex: 1; min-width: 160px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 26px; }
  .check label { margin: 0; text-transform: none; font-size: 14px; font-weight: 500; color: var(--ink); }
  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 18px; margin-top: 6px; }
  .cats .check { margin-top: 0; }
  .cats-head { display: flex; align-items: baseline; gap: 10px; margin-top: 16px; }
  .cats-head label { margin: 0; }
  .cats-head a { font-size: 12.5px; color: var(--accent); text-decoration: none; }
  .cats-head a:hover { text-decoration: underline; }
  button { padding: 10px 22px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { background: #9db8e8; cursor: wait; }
  button.ghost { background: #eef1f5; color: var(--ink); font-weight: 500; font-size: 13.5px; padding: 8px 14px; }
  .actions { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
  #status { font-size: 14px; color: var(--muted); }
  #status.error { color: var(--high); font-weight: 600; }
  .cards { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; min-width: 130px; }
  .card .num { font-size: 24px; font-weight: 700; }
  .card .label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .controls { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .controls input, .controls select { width: auto; }
  .controls input { flex: 1; min-width: 200px; }
  .doc { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .doc-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; padding: 12px 16px; background: #eef1f5; border-bottom: 1px solid var(--line); }
  .doc-head .path { font-family: ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 600; word-break: break-all; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 20px; background: #dbe4f0; color: var(--ink); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  tr:last-child td { border-bottom: none; }
  td.mono { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; word-break: break-all; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; color: #fff; font-size: 11px; font-weight: 600; text-transform: uppercase; }
  .badge.high { background: var(--high); } .badge.medium { background: var(--medium); } .badge.low { background: var(--low); }
  .downloads { display: flex; gap: 10px; margin: 16px 0 0; flex-wrap: wrap; }
  .hidden { display: none; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .tabs button { background: transparent; color: var(--muted); border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 10px 18px; font-size: 14.5px; font-weight: 600; margin-bottom: -1px; }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs button:hover { color: var(--ink); }
  .settings { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px; margin: 0 0 18px; font-size: 13.5px; }
  .settings summary { cursor: pointer; font-weight: 600; }
  .settings dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 18px; margin: 10px 0 0; }
  .settings dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
  .settings dd { margin: 0; word-break: break-word; }
  .settings dd.mono { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .viewing:not(.hidden) { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 0 0 18px; padding: 12px 16px; border-radius: 8px; background: #e8f1ff; border: 1px solid #bcd4ff; font-size: 13.5px; }
  .viewing a { color: var(--accent); }
  .hist-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 12px; }
  .hist-head label { margin: 0; }
  .hist-head .dir { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
  .hist-head button { margin-left: auto; }
  .hist td.when { white-space: nowrap; font-weight: 600; font-size: 13px; }
  .hist td.roots { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; word-break: break-all; max-width: 420px; }
  .hist td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hist th.num { text-align: right; }
  .hist .chip { margin: 1px 2px 1px 0; }
  .hist .chip.warn { background: #fdecea; color: var(--high); }
  .hist tr.current td { background: #f3f7ff; }
  .access { margin-top: 14px; padding: 12px 16px; border-radius: 8px; border: 1px solid; font-size: 13.5px; }
  .access.ok { background: #e9f7ef; border-color: #b9e3c8; }
  .access.info { background: #eef1f5; border-color: var(--line); color: var(--muted); }
  .access.need { background: #fff7e6; border-color: #f2d59b; }
  .access ol { margin: 8px 0 0; padding-left: 22px; }
  .access li { margin: 2px 0; }
  .access .btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
  .access .btns a { font-size: 13px; color: var(--accent); }
  .hbtn { background: transparent; border: 1px solid #5b6875; color: #dfe6ee; padding: 6px 14px; font-size: 13px; }
  .hbtn:disabled { background: transparent; color: #8a97a4; cursor: default; }
  #updateBox { border-bottom: 1px solid var(--line); padding: 12px 32px; font-size: 14px; background: #eef4ff; }
  #updateBox.ok { background: #e9f7ef; }
  #updateBox.err { background: #fdecea; }
  #updateBox .inner { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  #updateBox .inner button { padding: 7px 16px; font-size: 14px; }
  #updateBox .ver { font-weight: 600; }
  #updateBox pre { margin: 0; padding: 8px 12px; background: #fff; border: 1px solid var(--line); border-radius: 6px; font-size: 12.5px; white-space: pre-wrap; word-break: break-all; flex-basis: 100%; }
  #updateBox details { flex-basis: 100%; font-size: 13px; }
  #updateBox details pre { margin-top: 6px; }
  #updTrack { flex: 1; min-width: 160px; max-width: 320px; height: 6px; background: #cdd6e0; border-radius: 3px; overflow: hidden; }
  #updFill { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2.5px solid #cdd6e0; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header><h1>PrivacyLens</h1><span class="sub">PII discovery scanner · version __VERSION__</span>
  <button id="updateBtn" type="button" class="hbtn" title="Look for a newer version of PrivacyLens on GitHub" style="margin-left:auto">Check for updates</button>
  <button id="quitBtn" type="button" class="hbtn" title="Stop PrivacyLens on this computer">Quit PrivacyLens</button>
</header>
<div id="updateBox" class="hidden" role="status" aria-live="polite"><div class="inner" id="updateInner"></div></div>
<div id="stopped" class="hidden" role="alert" style="background:#fdecea;border-bottom:1px solid #f5c6c1;padding:14px 32px;font-size:14px">
  <strong id="stoppedHead">PrivacyLens is no longer running.</strong> <span id="stoppedWhy"></span>
  <span id="stoppedTail">Reports that were saved are still on this computer. To scan again, start PrivacyLens again and close this tab.</span>
</div>
<main>
  <nav class="tabs" role="tablist">
    <button type="button" class="active" role="tab" data-tab="scan" id="tabScan" aria-selected="true">Scan</button>
    <button type="button" role="tab" data-tab="history" id="tabHistory" aria-selected="false">Past scans</button>
  </nav>
  <section id="tab-scan">
  <div class="panel" id="scanForm">
    <label for="paths">Folders or files to scan (one per line)</label>
    <textarea id="paths" rows="3" placeholder="__EXAMPLE_PATHS__">__DEFAULT_PATHS__</textarea>
    <div class="row">
      <div>
        <label for="excludes">Exclude patterns (comma-separated)</label>
        <input type="text" id="excludes" placeholder="node_modules, *.bak, *.png" title="File or folder names, globs like *.png, or any part of a path. Case does not matter.">
      </div>
      <div>
        <label for="excludeEmails">Emails to ignore (exact address, or @domain for the whole domain)</label>
        <input type="text" id="excludeEmails" placeholder="info@cybxsecurity.com, @cybxsecurity.com">
      </div>
      <div>
        <label for="minconf">Minimum confidence</label>
        <select id="minconf">
          <option value="low" selected>Low — report everything</option>
          <option value="medium">Medium and above</option>
          <option value="high">High only</option>
        </select>
      </div>
      <div>
        <label for="maxsize">Max file size (MB)</label>
        <input type="number" id="maxsize" value="50" min="1">
      </div>
      <div class="check">
        <input type="checkbox" id="showfull">
        <label for="showfull">Show full values (unmasked)</label>
      </div>
      <div class="check">
        <input type="checkbox" id="ocr">
        <label for="ocr">OCR scanned documents &amp; images (slow; needs Tesseract installed)</label>
      </div>
      <div class="check">
        <input type="checkbox" id="includecloud">
        <label for="includecloud">Include cloud-only files (forces OneDrive/iCloud to download each one)</label>
      </div>
      <div class="check">
        <input type="checkbox" id="scanall">
        <label for="scanall">Scan everything (also AppData, Recycle Bin, caches, node_modules)</label>
      </div>
      <div class="check">
        <input type="checkbox" id="mail">
        <label for="mail" title="Searches .pst/.ost files under the paths above plus Outlook's own data folders on this computer (Outlook for Mac keeps one file per message). On a Mac this needs Full Disk Access; a box below explains if it is missing.">Mail scan — Outlook mailboxes only (.pst/.ost and Outlook for Mac), read message by message</label>
      </div>
      <div class="check">
        <input type="checkbox" id="wazuhlog" checked>
        <label for="wazuhlog">Write findings to the machine-wide Insights log the SIEM agent watches (falls back to your per-user log if unavailable)</label>
      </div>
    </div>
    <div id="mailAccess" class="access hidden" role="status"></div>
    <div class="cats-head">
      <label>PII types to look for</label>
      <a href="#" id="catsAll">select all</a>
      <a href="#" id="catsNone">select none</a>
    </div>
    <div class="cats" id="cats"></div>
    <div class="actions">
	      <button id="scanBtn">Scan</button>
	      <button id="cancelBtn" class="ghost hidden" type="button">Cancel scan</button>
	      <span id="status" role="status" aria-live="polite"></span>
	      <div id="progTrack" class="hidden" role="progressbar" aria-label="Scan progress" aria-valuemin="0" aria-valuemax="100" style="flex:1;max-width:320px;height:6px;background:var(--line);border-radius:3px;overflow:hidden">
        <div id="progFill" style="height:100%;width:0%;background:var(--accent);transition:width .4s"></div>
      </div>
    </div>
  </div>
  </section>

  <section id="tab-history" class="hidden">
    <div class="panel">
      <div class="hist-head">
        <label>Saved scans on this computer</label>
        <span class="dir" id="histDir"></span>
        <button class="ghost" type="button" id="histRefresh">Refresh</button>
      </div>
      <div id="histList" class="hist"><div class="empty">Loading…</div></div>
    </div>
  </section>

  <div id="results" class="hidden">
    <div id="viewing" class="viewing hidden"></div>
    <details class="settings" id="settingsUsed" open><summary>Scan settings used</summary><dl id="settingsList"></dl></details>
    <div class="cards" id="cards"></div>
    <div class="controls">
      <input id="search" type="search" placeholder="Filter by file, category, or context…">
      <select id="catFilter"><option value="">All categories</option></select>
      <select id="confFilter">
        <option value="">All confidence</option>
        <option value="high">High only</option>
        <option value="medium">Medium+</option>
      </select>
    </div>
    <div id="docs"></div>
    <div id="logWarn" class="hidden" style="margin-top:16px;padding:12px 16px;border-radius:8px;background:#fdecea;border:1px solid #f5c6c1;font-size:13.5px"></div>
    <div id="savedNote" class="hidden" style="margin-top:16px;padding:12px 16px;border-radius:8px;border:1px solid;font-size:13.5px"></div>
    <div id="ocrNotice" class="hidden" style="margin-top:16px;padding:12px 16px;border-radius:8px;background:#fff7e6;border:1px solid #f2d59b;font-size:13.5px"></div>
    <div class="downloads">
      <button class="ghost" data-fmt="html">Download HTML report</button>
      <button class="ghost" data-fmt="json">Download JSON</button>
      <button class="ghost" data-fmt="csv">Download CSV</button>
      <button class="ghost" data-fmt="syslog">Download syslog/CEF (Insights)</button>
    </div>
  </div>
</main>
<script>
(function () {
  var TOKEN = new URLSearchParams(location.search).get('token') || '';
  // Keep the capability token out of browser history, copied URLs, and
  // referrer data once this page has captured it in memory.
  if (TOKEN && history.replaceState) { history.replaceState(null, '', location.pathname); }
  // The URL no longer carries the token, so a page reload would lose it and
  // every request would fail. sessionStorage keeps it for this tab only —
  // it is scoped to this origin (this exact port) and gone when the tab
  // closes.
  try {
    if (TOKEN) { sessionStorage.setItem('pl-token', TOKEN); }
    else { TOKEN = sessionStorage.getItem('pl-token') || ''; }
  } catch (e) { /* storage unavailable; the page works until reloaded */ }
  var CATEGORIES = __CATEGORIES__;
  var scanBtn = document.getElementById('scanBtn');
  var cancelBtn = document.getElementById('cancelBtn');
  var scanController = null;
  var status = document.getElementById('status');
  var results = document.getElementById('results');
  var docs = document.getElementById('docs');
  var cards = document.getElementById('cards');
  var catFilter = document.getElementById('catFilter');
  var lastFindings = [];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // Exclusions are "comma-separated", but people also type "*.png *.jpg" or
  // use semicolons or new lines. Split on all of those - and on spaces too
  // when every piece is clearly a pattern (has * or ? or starts with a
  // dot), so "*.png *.jpg" becomes two patterns while a folder name with a
  // space in it, like "Old Backups", stays whole.
  function splitPatterns(text) {
    var out = [];
    text.split(/[,;\n]/).forEach(function (item) {
      item = item.trim();
      if (!item) { return; }
      var parts = item.split(/\s+/);
      var allPatterns = parts.length > 1 && parts.every(function (p) { return /[*?]/.test(p) || p.charAt(0) === '.'; });
      if (allPatterns) { parts.forEach(function (p) { out.push(p); }); } else { out.push(item); }
    });
    return out;
  }

  function setStatus(msg, isError) {
    status.className = isError ? 'error' : '';
    status.innerHTML = msg;
  }

  // Live progress while /api/scan is in flight: poll /api/progress and show
  // "file 139 of 9,022" plus a bar, so a big scan never looks hung.
  var progTimer = null;
  var progTrack = document.getElementById('progTrack');
  var progFill = document.getElementById('progFill');
  function fmtNum(n) { return Number(n || 0).toLocaleString(); }
  function pollProgress() {
    fetch('/api/progress', { headers: { 'X-PL-Token': TOKEN } })
      .then(function (r) { return r.json(); })
      .then(function (p) {
        if (!progTimer || !p.active) { return; }
        if (p.total === 0) {
          setStatus('<span class="spinner"></span>Starting scan…');
        } else if (p.done === 0) {
          setStatus('<span class="spinner"></span>Finding files… ' + fmtNum(p.total) + ' so far');
        } else if (p.done >= p.total) {
          // Every file is scanned but /api/scan hasn't returned: the server
          // is sorting, saving, and shipping the report.
          setStatus('<span class="spinner"></span>Finalizing report… ' + fmtNum(p.findings) +
            ' finding' + (p.findings === 1 ? '' : 's'));
          progTrack.classList.remove('hidden');
          progFill.style.width = '100%';
	        } else {
          setStatus('<span class="spinner"></span>Scanning file ' + fmtNum(p.done) + ' of ' + fmtNum(p.total) +
            ' — ' + fmtNum(p.findings) + ' finding' + (p.findings === 1 ? '' : 's'));
          progTrack.classList.remove('hidden');
	          progFill.style.width = Math.min(100, (p.done / p.total) * 100) + '%';
	          progTrack.setAttribute('aria-valuenow', String(Math.round(Math.min(100, (p.done / p.total) * 100))));
        }
      })
      .catch(function () { /* transient poll failure; next tick retries */ });
  }
  function startProgress() {
    progFill.style.width = '0%';
    progTimer = setInterval(pollProgress, 500);
  }
  function stopProgress() {
    clearInterval(progTimer);
    progTimer = null;
    progTrack.classList.add('hidden');
  }

  if (!TOKEN) {
    setStatus('This page was opened without its access link. Close this tab and start PrivacyLens again.', true);
    scanBtn.disabled = true;
  }

  // Heartbeat: tells the server a page is still open (the double-click
  // launcher exits on its own once none is), and tells the user plainly
  // when the server has gone away instead of failing on the next click.
  var stopped = false, missedPings = 0;
  var updating = false; // an update is replacing this version
  function showStopped(why) {
    stopped = true;
    if (updating) {
      byId('stoppedHead').textContent = 'PrivacyLens is restarting with the new version.';
      byId('stoppedTail').textContent = 'It reopens in a new browser tab by itself; you can close this one.';
      why = '';
    }
    document.getElementById('stoppedWhy').textContent = why || '';
    document.getElementById('stopped').classList.remove('hidden');
    scanBtn.disabled = true;
    document.getElementById('quitBtn').disabled = true;
  }
  function ping() {
    if (stopped || !TOKEN) { return; }
    fetch('/api/ping', { headers: { 'X-PL-Token': TOKEN } }).then(function (r) {
      missedPings = r.ok ? 0 : missedPings + 1;
    }).catch(function () { missedPings++; }).then(function () {
      if (missedPings >= (updating ? 1 : 2) && !scanController) { showStopped('It was closed or stopped after sitting idle.'); }
    });
  }
  setInterval(ping, 20000);
  document.getElementById('quitBtn').addEventListener('click', function () {
    if (scanController && !confirm('A scan is still running. Quit PrivacyLens and cancel it?')) { return; }
    fetch('/api/quit', { method: 'POST', headers: { 'X-PL-Token': TOKEN } })
      .catch(function () { /* the server closing mid-reply is success here */ })
      .then(function () { showStopped(''); });
  });

  var catsBox = document.getElementById('cats');
  catsBox.innerHTML = CATEGORIES.map(function (c, i) {
    return '<div class="check"><input type="checkbox" id="cat' + i + '" checked data-cat="' + esc(c) + '">' +
      '<label for="cat' + i + '">' + esc(c) + '</label></div>';
  }).join('');
  function setAllCats(on) {
    catsBox.querySelectorAll('input').forEach(function (el) { el.checked = on; });
    scheduleSave();
  }

  // ---- Remembered form state -------------------------------------------
  // Every change to the scan form is saved on the server (in the PrivacyLens
  // data folder) and restored on the next launch, so the window opens the
  // way it was left. Not browser storage: the GUI listens on a random port
  // each launch and browsers scope their storage to the port.
  var form = document.getElementById('scanForm');
  var saveTimer = null;
  function byId(id) { return document.getElementById(id); }
  function collectSettings() {
    return {
      paths: byId('paths').value,
      excludes: byId('excludes').value,
      exclude_emails: byId('excludeEmails').value,
      min_confidence: byId('minconf').value,
      max_size_mb: parseInt(byId('maxsize').value, 10) || 50,
      show_full: byId('showfull').checked,
      ocr: byId('ocr').checked,
      include_cloud: byId('includecloud').checked,
      scan_all: byId('scanall').checked,
      mail: byId('mail').checked,
      wazuh_log: byId('wazuhlog').checked,
      categories_off: [].map.call(catsBox.querySelectorAll('input:not(:checked)'), function (el) { return el.dataset.cat; })
    };
  }
  function applySettings(st) {
    if (!st || typeof st !== 'object') { return; }
    if (typeof st.paths === 'string' && st.paths.trim()) { byId('paths').value = st.paths; }
    if (typeof st.excludes === 'string') { byId('excludes').value = st.excludes; }
    if (typeof st.exclude_emails === 'string') { byId('excludeEmails').value = st.exclude_emails; }
    if (st.min_confidence) { byId('minconf').value = st.min_confidence; }
    if (st.max_size_mb > 0) { byId('maxsize').value = st.max_size_mb; }
    ['show_full:showfull', 'ocr:ocr', 'include_cloud:includecloud', 'scan_all:scanall', 'mail:mail', 'wazuh_log:wazuhlog']
      .forEach(function (pair) {
        var k = pair.split(':');
        if (typeof st[k[0]] === 'boolean') { byId(k[1]).checked = st[k[0]]; }
      });
    var off = {};
    (st.categories_off || []).forEach(function (c) { off[c] = true; });
    catsBox.querySelectorAll('input').forEach(function (el) { el.checked = !off[el.dataset.cat]; });
  }
  function saveSettings() {
    clearTimeout(saveTimer); saveTimer = null;
    if (!TOKEN || stopped) { return Promise.resolve(); }
    return fetch('/api/settings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-PL-Token': TOKEN },
      body: JSON.stringify(collectSettings())
    }).catch(function () { /* the next change retries; the scan itself is unaffected */ });
  }
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveSettings, 400);
  }
  form.addEventListener('input', scheduleSave);
  form.addEventListener('change', scheduleSave);
  if (TOKEN) {
    fetch('/api/settings', { headers: { 'X-PL-Token': TOKEN } })
      .then(function (r) { return r.status === 200 ? r.json() : null; })
      .then(applySettings)
      .catch(function () { /* defaults stay */ })
      .then(checkMailAccess);
  }

  // ---- Outlook mailbox access -------------------------------------------
  // With "Mail scan" ticked, ask the server whether it can actually read
  // the Outlook mailbox on this computer. macOS refuses until PrivacyLens
  // has Full Disk Access, and nothing can prompt for that — so the page
  // opens the right System Settings pane and names the app to switch on.
  var mailAccessBox = byId('mailAccess');
  var mailCheck = byId('mail');
  function fdaButtons(ma) {
    return '<div class="btns">' +
      '<button type="button" class="ghost" data-fda="open">Open Full Disk Access settings</button>' +
      '<button type="button" class="ghost" data-fda="check">Check again</button>' +
      (ma && ma.app_path ? '<a href="#" data-fda="reveal">Show PrivacyLens in Finder</a>' : '') +
      '</div>';
  }
  function fdaSteps(ma) {
    var who = esc(ma.grant_to || 'PrivacyLens');
    return '<ol>' +
      '<li>Click <strong>Open Full Disk Access settings</strong> below.</li>' +
      '<li>Turn on <strong>' + who + '</strong> in the list. If it is not listed, click <strong>+</strong>' +
        (ma.app_path ? ', pick <strong>PrivacyLens</strong> in Applications' : ', pick <strong>' + who + '</strong>') +
        ', and turn it on' + (ma.app_path ? ' (or drag it from the Finder window)' : '') + '.</li>' +
      '<li>Quit PrivacyLens (top right), open it again, and run the mail scan.</li>' +
      '</ol>';
  }
  function showMailAccess(ma) {
    if (!mailCheck.checked) { mailAccessBox.classList.add('hidden'); return; }
    mailAccessBox.classList.remove('hidden', 'ok', 'info', 'need');
    if (!ma.present) {
      mailAccessBox.classList.add('info');
      mailAccessBox.innerHTML = 'No Outlook mailbox data was found on this computer. The mail scan will open only ' +
        '.pst/.ost files under the paths above.';
    } else if (ma.needs_full_disk_access) {
      mailAccessBox.classList.add('need');
      mailAccessBox.innerHTML = '<strong>Your Outlook mailbox cannot be read yet.</strong> macOS protects Outlook for Mac\'s data ' +
        'until PrivacyLens has <strong>Full Disk Access</strong>. Nothing leaves this Mac; the permission only lets PrivacyLens read the mailbox files.' +
        fdaSteps(ma) + fdaButtons(ma);
    } else if (!ma.readable) {
      mailAccessBox.classList.add('need');
      mailAccessBox.innerHTML = '<strong>Your Outlook mailbox cannot be read:</strong> permission denied on ' + esc(ma.location) +
        '. Run PrivacyLens as a user who can read it.' + '<div class="btns"><button type="button" class="ghost" data-fda="check">Check again</button></div>';
    } else {
      mailAccessBox.classList.add('ok');
      mailAccessBox.innerHTML = '<strong>Outlook mailbox found</strong> — it will be searched: <span style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px">' +
        esc(ma.location) + '</span>';
    }
  }
  var lastMailAccess = null;
  function checkMailAccess() {
    if (!TOKEN || !mailCheck.checked) { mailAccessBox.classList.add('hidden'); return; }
    fetch('/api/mailaccess', { headers: { 'X-PL-Token': TOKEN } })
      .then(function (r) { return r.json(); })
      .then(function (ma) { lastMailAccess = ma; showMailAccess(ma); })
      .catch(function () { /* the scan itself still warns if the mailbox is unreadable */ });
  }
  mailCheck.addEventListener('change', checkMailAccess);
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-fda]');
    if (!el) { return; }
    ev.preventDefault();
    if (el.dataset.fda === 'check') { checkMailAccess(); return; }
    var q = el.dataset.fda === 'reveal' ? '?reveal=1' : '';
    fetch('/api/mailaccess/settings' + q, { method: 'POST', headers: { 'X-PL-Token': TOKEN } })
      .then(function (r) { if (!r.ok) { return r.text().then(function (t) { throw new Error(t); }); } })
      .catch(function (err) { setStatus(esc(err.message), true); });
  });

  // ---- Updates ---------------------------------------------------------
  // "Check for updates" asks the server to look at GitHub Releases. If a
  // newer version exists, one more click downloads it (checksum-verified),
  // runs the installer, and the new version reopens in a new tab.
  var updateBtn = byId('updateBtn');
  var updateBox = byId('updateBox');
  var updateInner = byId('updateInner');
  var updTimer = null;
  function showUpdate(cls, html) {
    updateBox.className = cls || '';
    updateInner.innerHTML = html;
  }
  function notesBlock(notes) {
    return notes ? '<details><summary>What\'s new</summary><pre>' + esc(notes) + '</pre></details>' : '';
  }
  function fmtMB(n) { return (n / 1048576).toFixed(1) + ' MB'; }
  function checkForUpdates() {
    updateBtn.disabled = true;
    showUpdate('', '<span class="spinner"></span>Checking for a newer version… you have <span class="ver">version ' + esc(updateBtn.dataset.version) + '</span>.');
    fetch('/api/update/check', { headers: { 'X-PL-Token': TOKEN } })
      .then(function (r) { return r.json(); })
      .then(function (u) {
        updateBtn.disabled = stopped;
        if (u.error && !u.latest) {
          showUpdate('err', '<strong>Could not check for updates.</strong> ' + esc(u.error) +
            ' <button type="button" class="ghost" id="updRetry">Try again</button> <a href="#" id="updClose" style="margin-left:auto">Close</a>');
          return;
        }
        if (!u.available) {
          showUpdate('ok', '<strong>You have the latest version</strong> (' + esc(u.current) + ').' +
            (u.published_at ? ' Newest release: ' + esc(u.latest) + ', ' + fmtWhen(u.published_at) + '.' : '') +
            ' <a href="#" id="updClose" style="margin-left:auto">Close</a>');
          return;
        }
        var how = u.manual
          ? 'It will be downloaded and verified; a short terminal command finishes the install.'
          : 'Installing takes about a minute and asks for your ' + (navigator.platform.indexOf('Win') === 0 ? 'permission' : 'password') + '. PrivacyLens reopens by itself when it is done.';
        showUpdate('', '<strong>Version ' + esc(u.latest) + ' is available</strong> — you have ' + esc(u.current) + '.' +
          (u.published_at ? ' Released ' + fmtWhen(u.published_at) + '.' : '') +
          (u.size ? ' Download: ' + fmtMB(u.size) + '.' : '') +
          ' <button type="button" id="updInstall">Install update</button>' +
          (u.url ? ' <a href="' + esc(u.url) + '" target="_blank" rel="noopener">Release page</a>' : '') +
          ' <a href="#" id="updClose" style="margin-left:auto">Not now</a>' +
          '<div style="flex-basis:100%;font-size:13px;color:var(--muted)">' + how + '</div>' +
          notesBlock(u.notes));
      })
      .catch(function (err) {
        updateBtn.disabled = stopped;
        showUpdate('err', '<strong>Could not check for updates.</strong> ' + esc(err.message) + ' <a href="#" id="updClose" style="margin-left:auto">Close</a>');
      });
  }
  function renderUpdateStatus(st) {
    if (st.phase === 'downloading') {
      var pct = st.total > 0 ? Math.min(100, Math.round(st.done * 100 / st.total)) : 0;
      showUpdate('', '<span class="spinner"></span>Downloading version ' + esc(st.version) + '… ' + pct + '%' +
        '<div id="updTrack" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><div id="updFill" style="width:' + pct + '%"></div></div>');
    } else if (st.phase === 'installing' || st.phase === 'relaunching') {
      showUpdate('', '<span class="spinner"></span><strong>' + (st.phase === 'installing' ? 'Installing version ' + esc(st.version) + '…' : 'Reopening…') + '</strong> ' + esc(st.message || ''));
    } else if (st.phase === 'manual') {
      showUpdate('ok', '<strong>Version ' + esc(st.version) + ' downloaded and verified.</strong> ' + esc(st.message || '') +
        '<pre>' + esc(st.steps || '') + '</pre>');
    } else if (st.phase === 'done') {
      showUpdate('ok', '<strong>Update complete.</strong> ' + esc(st.message || ''));
    } else if (st.phase === 'error') {
      updating = false;
      updateBtn.disabled = stopped;
      showUpdate('err', '<strong>The update did not finish:</strong> ' + esc(st.error || 'unknown error') +
        ' <button type="button" class="ghost" id="updRetry">Check again</button> <a href="#" id="updClose" style="margin-left:auto">Close</a>');
    }
  }
  function pollUpdate() {
    fetch('/api/update/status', { headers: { 'X-PL-Token': TOKEN } })
      .then(function (r) { return r.json(); })
      .then(function (st) {
        renderUpdateStatus(st);
        if (st.phase === 'done' || st.phase === 'error' || st.phase === 'manual') { clearInterval(updTimer); updTimer = null; }
      })
      .catch(function () {
        // The old version has gone away mid-update: the installer (or the
        // relaunch) stopped it. The heartbeat shows the restart banner.
      });
  }
  function installUpdate() {
    if (scanController) { showUpdate('err', 'A scan is running. Wait for it to finish or cancel it, then install the update.'); return; }
    updating = true;
    updateBtn.disabled = true;
    fetch('/api/update/install', { method: 'POST', headers: { 'X-PL-Token': TOKEN } })
      .then(function (r) { if (!r.ok) { return r.text().then(function (t) { throw new Error(t); }); } })
      .then(function () {
        renderUpdateStatus({ phase: 'downloading', done: 0, total: 0, version: '' });
        updTimer = setInterval(pollUpdate, 700);
      })
      .catch(function (err) { renderUpdateStatus({ phase: 'error', error: err.message }); });
  }
  updateBtn.dataset.version = document.title.replace(/^PrivacyLens v/, '');
  updateBtn.addEventListener('click', checkForUpdates);
  updateBox.addEventListener('click', function (ev) {
    var t = ev.target;
    if (t.id === 'updInstall') { installUpdate(); }
    else if (t.id === 'updRetry') { checkForUpdates(); }
    else if (t.id === 'updClose') { ev.preventDefault(); updateBox.className = 'hidden'; }
  });

  // ---- Tabs ------------------------------------------------------------
  var liveReport = null;     // the scan run in this window, if any
  var viewedReport = null;   // the saved scan chosen on the Past scans tab
  var viewedName = '';
  var activeTab = 'scan';
  var viewingBanner = byId('viewing');
  function showTab(name) {
    activeTab = name;
    document.querySelectorAll('.tabs button').forEach(function (b) {
      var on = b.dataset.tab === name;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    byId('tab-scan').classList.toggle('hidden', name !== 'scan');
    byId('tab-history').classList.toggle('hidden', name !== 'history');
    if (name === 'scan') {
      viewingBanner.classList.add('hidden');
      if (liveReport) { render(liveReport); } else { results.classList.add('hidden'); }
    } else {
      loadHistory();
      if (viewedReport) { render(viewedReport, viewedName); } else { results.classList.add('hidden'); }
    }
  }
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () { showTab(b.dataset.tab); });
  });

  // ---- Past scans ------------------------------------------------------
  var histList = byId('histList');
  function fmtWhen(iso) {
    var d = new Date(iso);
    return isNaN(d) ? esc(iso) : esc(d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }));
  }
  // Compact chips for the settings that change what a scan can find.
  function paramChips(e) {
    var p = e.params, chips = [];
    if (!e.masked) { chips.push('<span class="chip warn">unmasked</span>'); }
    if (!p) { chips.push('<span class="chip">settings not recorded</span>'); return chips.join(''); }
    if (p.source) { chips.push('<span class="chip">' + (p.source === 'cli' ? 'command line' : 'window') + '</span>'); }
    if (p.min_confidence && p.min_confidence !== 'low') { chips.push('<span class="chip">' + esc(p.min_confidence) + '+ only</span>'); }
    if (p.categories && p.categories.length) { chips.push('<span class="chip">' + p.categories.length + ' of ' + CATEGORIES.length + ' PII types</span>'); }
    if (p.excludes && p.excludes.length) { chips.push('<span class="chip">' + p.excludes.length + ' exclusion' + (p.excludes.length === 1 ? '' : 's') + '</span>'); }
    if (p.exclude_emails && p.exclude_emails.length) { chips.push('<span class="chip">' + p.exclude_emails.length + ' ignored email' + (p.exclude_emails.length === 1 ? '' : 's') + '</span>'); }
    if (p.ocr) { chips.push('<span class="chip">OCR</span>'); }
    if (p.mail) { chips.push('<span class="chip">mail scan</span>'); }
    if (p.scan_all) { chips.push('<span class="chip">scan everything</span>'); }
    if (p.include_cloud) { chips.push('<span class="chip">cloud files</span>'); }
    if (p.insights_log === false) { chips.push('<span class="chip warn">no Insights log</span>'); }
    return chips.join('');
  }
  function loadHistory() {
    if (!TOKEN) { return; }
    fetch('/api/history', { headers: { 'X-PL-Token': TOKEN } })
      .then(function (r) { if (!r.ok) { return r.text().then(function (t) { throw new Error(t); }); } return r.json(); })
      .then(function (h) {
        byId('histDir').textContent = h.dir || '';
        var reports = h.reports || [];
        if (!reports.length) {
          histList.innerHTML = '<div class="empty">No saved scans yet. Every scan run from this window or the command line is saved here automatically.</div>';
          return;
        }
        histList.innerHTML = '<table><thead><tr><th>When</th><th>Scanned</th><th class="num">Findings</th><th class="num">Files</th><th>Settings</th><th></th></tr></thead><tbody>' +
          reports.map(function (e) {
            var roots = (e.roots || []);
            var shown = roots.slice(0, 3).map(esc).join('<br>') + (roots.length > 3 ? '<br>… and ' + (roots.length - 3) + ' more' : '');
            return '<tr data-name="' + esc(e.name) + '"' + (e.name === viewedName ? ' class="current"' : '') + '>' +
              '<td class="when">' + fmtWhen(e.generated_at) + '<div style="font-weight:400;color:var(--muted);font-size:12px">' + esc(e.duration || '') + (e.version ? ' · v' + esc(e.version) : '') + '</div></td>' +
              '<td class="roots">' + shown + '</td>' +
              '<td class="num"' + (e.findings ? ' style="font-weight:700"' : '') + '>' + fmtNum(e.findings) + '</td>' +
              '<td class="num">' + fmtNum(e.files_scanned) + '</td>' +
              '<td>' + paramChips(e) + '</td>' +
              '<td style="white-space:nowrap"><button class="ghost" type="button" data-view="' + esc(e.name) + '">' + (e.name === viewedName ? 'Viewing' : 'View') + '</button></td></tr>';
          }).join('') + '</tbody></table>';
      })
      .catch(function (err) {
        histList.innerHTML = '<div class="empty">Could not list saved scans: ' + esc(err.message) + '</div>';
      });
  }
  histList.addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-view]');
    if (!btn) { return; }
    var name = btn.dataset.view;
    btn.disabled = true; btn.textContent = 'Loading…';
    fetch('/api/history/report?name=' + encodeURIComponent(name), { headers: { 'X-PL-Token': TOKEN } })
      .then(function (r) { if (!r.ok) { return r.text().then(function (t) { throw new Error(t); }); } return r.json(); })
      .then(function (rep) {
        viewedReport = rep; viewedName = name;
        loadHistory();
        render(rep, name);
        results.scrollIntoView({ behavior: 'smooth', block: 'start' });
      })
      .catch(function (err) {
        btn.disabled = false; btn.textContent = 'View';
        histList.insertAdjacentHTML('afterbegin', '<div class="empty" style="padding:12px;color:var(--high)">Could not open that scan: ' + esc(err.message) + '</div>');
      });
  });
  byId('histRefresh').addEventListener('click', loadHistory);
  document.getElementById('catsAll').addEventListener('click', function (e) { e.preventDefault(); setAllCats(true); });
  document.getElementById('catsNone').addEventListener('click', function (e) { e.preventDefault(); setAllCats(false); });

  scanBtn.addEventListener('click', function () {
    var paths = document.getElementById('paths').value
      .split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    if (!paths.length) { setStatus('Enter at least one folder or file path.', true); return; }
    var excludes = splitPatterns(document.getElementById('excludes').value);
    var excludeEmails = document.getElementById('excludeEmails').value
      .split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    var selCats = [].map.call(catsBox.querySelectorAll('input:checked'), function (el) { return el.dataset.cat; });
    if (!selCats.length) { setStatus('Select at least one PII type to look for.', true); return; }
    var body = {
      paths: paths,
      excludes: excludes,
      exclude_emails: excludeEmails,
      // All types checked = no restriction, so a future detector added
      // server-side is never silently excluded by an old default.
      categories: selCats.length === CATEGORIES.length ? [] : selCats,
      min_confidence: document.getElementById('minconf').value,
      max_size_mb: parseInt(document.getElementById('maxsize').value, 10) || 50,
      show_full: document.getElementById('showfull').checked,
      ocr: document.getElementById('ocr').checked,
      include_cloud: document.getElementById('includecloud').checked,
      scan_all: document.getElementById('scanall').checked,
      mail: document.getElementById('mail').checked,
      wazuh_log: document.getElementById('wazuhlog').checked
    };
	    scanBtn.disabled = true;
	    cancelBtn.classList.remove('hidden');
	    scanController = new AbortController();
    saveSettings();
    setStatus('<span class="spinner"></span>Starting scan…');
    startProgress();
    fetch('/api/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-PL-Token': TOKEN },
	      body: JSON.stringify(body),
	      signal: scanController.signal
    }).then(function (resp) {
      if (!resp.ok) { return resp.text().then(function (t) { throw new Error(t); }); }
      return resp.json();
    }).then(function (rep) {
      liveReport = rep;
      render(rep);
    }).catch(function (err) {
      setStatus('Scan failed: ' + esc(err.message), true);
      results.classList.add('hidden');
	    }).finally(function () {
	      stopProgress(); scanBtn.disabled = stopped;
	      cancelBtn.classList.add('hidden'); scanController = null;
	    });
	  });
	  cancelBtn.addEventListener('click', function () {
	    if (scanController) { setStatus('Cancelling scan…'); scanController.abort(); }
	  });

  // render shows a report in the results area: the scan just run (savedName
  // empty — the summary goes on the status line) or a saved one from the
  // Past scans tab (savedName set — the summary goes in a banner, since the
  // status line belongs to the scan form).
  function render(rep, savedName) {
    lastFindings = rep.findings || [];
    var s = rep.stats || {};
    var excludesUsed = (rep.params && rep.params.excludes) || [];
    // How much of the tree the exclusions removed.
    var skippedNote = (s.files_skipped || 0) > 0 && excludesUsed.length
      ? ' - ' + s.files_skipped + ' skipped (excluded or not a document type)' : '';
    var summary = 'Scanned ' + fmtNum(s.files_scanned) + ' files in ' + esc(rep.duration) +
      ' — ' + lastFindings.length + ' finding' + (lastFindings.length === 1 ? '' : 's') +
      (rep.masked ? ' (values masked)' : ' (FULL VALUES SHOWN)') + esc(skippedNote);
    if (savedName) {
      viewingBanner.innerHTML = '<strong>Viewing saved scan from ' + fmtWhen(rep.generated_at) + '</strong>' +
        '<span>' + summary + '</span>' +
        '<a href="#" id="closeViewed" style="margin-left:auto">Close</a>';
      viewingBanner.classList.remove('hidden');
      byId('closeViewed').addEventListener('click', function (e) {
        e.preventDefault();
        viewedReport = null; viewedName = '';
        results.classList.add('hidden');
        loadHistory();
      });
    } else {
      setStatus(summary, false);
    }

    // What this scan looked for and where: the roots, then the settings
    // rows the server spelled out (the same wording as the HTML report).
    var rows = '<dt>Scanned</dt><dd class="mono">' + (rep.roots || []).map(esc).join('<br>') + '</dd>';
    if (rep.settings && rep.settings.length) {
      rows += rep.settings.map(function (l) { return '<dt>' + esc(l.label) + '</dt><dd>' + esc(l.value) + '</dd>'; }).join('');
    } else {
      rows += '<dt>Other settings</dt><dd>Not recorded — this scan was saved by an older version of PrivacyLens.</dd>';
    }
    if (s.mail_roots && s.mail_roots.length) {
      rows += '<dt>Also searched</dt><dd class="mono">' + s.mail_roots.map(esc).join('<br>') + '</dd>';
    }
    rows += '<dt>Values</dt><dd>' + (rep.masked ? 'Masked' : 'Full (unmasked)') + '</dd>';
    byId('settingsList').innerHTML = rows;

    var byCat = {};
    lastFindings.forEach(function (f) { byCat[f.category] = (byCat[f.category] || 0) + 1; });
    var catNames = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; });

    cards.innerHTML =
      '<div class="card"><div class="num">' + lastFindings.length + '</div><div class="label">Total findings</div></div>' +
      '<div class="card"><div class="num">' + (s.files_scanned || 0) + '</div><div class="label">Files scanned</div></div>' +
      '<div class="card"><div class="num">' + (s.files_skipped || 0) + '</div><div class="label">Files skipped</div></div>' +
      ((s.attachments_scanned || 0) > 0
        ? '<div class="card"><div class="num">' + s.attachments_scanned + '</div><div class="label">Mail attachments read</div></div>'
        : '') +
      ((s.files_need_ocr || 0) > 0
        ? '<div class="card"><div class="num" style="color:var(--medium)">' + s.files_need_ocr + '</div><div class="label">Need OCR (not searched)</div></div>'
        : '') +
      ((s.files_cloud_skipped || 0) > 0
        ? '<div class="card"><div class="num" style="color:var(--medium)">' + s.files_cloud_skipped + '</div><div class="label">Cloud-only (not searched)</div></div>'
        : '') +
      ((s.files_mail_skipped || 0) > 0
        ? '<div class="card"><div class="num" style="color:var(--medium)">' + s.files_mail_skipped + '</div><div class="label">Mail stores (not searched)</div></div>'
        : '') +
      ((s.files_errored || 0) > 0
        ? '<div class="card"><div class="num" style="color:var(--medium)">' + s.files_errored + '</div><div class="label">Unreadable (not searched)</div></div>'
        : '') +
      ((s.files_unreadable_docs || 0) > 0
        ? '<div class="card"><div class="num" style="color:var(--medium)">' + s.files_unreadable_docs + '</div><div class="label">Unreadable documents (not searched)</div></div>'
        : '') +
      catNames.map(function (c) {
        return '<div class="card"><div class="num">' + byCat[c] + '</div><div class="label">' + esc(c) + '</div></div>';
      }).join('');

    catFilter.innerHTML = '<option value="">All categories</option>' +
      catNames.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');

    if (!lastFindings.length) {
	      var gaps = (s.files_need_ocr || 0) + (s.files_cloud_skipped || 0) +
	        (s.files_mail_skipped || 0) + (s.files_unreadable_docs || 0) + (s.files_errored || 0);
	      docs.innerHTML = '<div class="empty">No PII matches found in searched content.' +
	        (gaps ? ' Review the coverage gaps below before treating this scan as clean.' : '') + '</div>';
    } else {
      // One entry per document listing everything found in it, instead of
      // interleaved per-finding rows.
      var groups = [], byPath = {};
      lastFindings.forEach(function (f) {
        if (!(f.path in byPath)) { byPath[f.path] = groups.length; groups.push({ path: f.path, findings: [] }); }
        groups[byPath[f.path]].findings.push(f);
      });
      docs.innerHTML = groups.map(function (g) {
        var counts = {};
        g.findings.forEach(function (f) { counts[f.category] = (counts[f.category] || 0) + 1; });
        var chips = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; })
          .map(function (c) { return '<span class="chip">' + esc(c) + ' ×' + counts[c] + '</span>'; }).join('');
        var rows = g.findings.map(function (f) {
          var loc = f.folder || f.subject
            ? '<strong>' + esc(f.subject || '(no subject)') + '</strong>' +
              '<div style="color:var(--muted);font-size:11.5px;margin-top:2px">' +
              [f.date, f.from, f.folder, f.attachment ? 'attachment ' + f.attachment + ', line ' + f.line : 'msg ' + f.line].filter(Boolean).map(esc).join(' · ') + '</div>'
            : (f.page ? 'page ' + f.page + ', line ' + f.line : 'line ' + f.line);
          return '<tr data-cat="' + esc(f.category) + '" data-conf="' + esc(f.confidence) + '">' +
            '<td style="white-space:nowrap;font-weight:600;font-size:13px">' + esc(f.category) + '</td>' +
            '<td><span class="badge ' + esc(f.confidence) + '">' + esc(f.confidence) + '</span></td>' +
            '<td style="font-size:13px;min-width:180px">' + loc + '</td>' +
            '<td class="mono" style="white-space:nowrap">' + esc(f.match) + '</td>' +
            '<td class="mono" style="color:#37474f">' + esc(f.context) + '</td></tr>';
        }).join('');
        return '<div class="doc"><div class="doc-head"><span class="path">' + esc(g.path) + '</span>' + chips + '</div>' +
          '<table><thead><tr><th>Category</th><th>Confidence</th><th>Location</th><th>Match</th><th>Context</th></tr></thead>' +
          '<tbody>' + rows + '</tbody></table></div>';
      }).join('');
    }
    var logWarn = document.getElementById('logWarn');
    var warns = [];
    (s.warnings || []).forEach(function (wmsg) {
      warns.push('<strong>⚠ ' + esc(wmsg) + '</strong>' +
        (!savedName && /Full Disk Access/.test(wmsg) ? fdaButtons(lastMailAccess) : ''));
    });
    if (rep.log_warning) { warns.push('<strong>⚠ ' + esc(rep.log_warning) + '</strong>'); }
    if (rep.save_error) { warns.push('Could not auto-save results: ' + esc(rep.save_error)); }
    if (warns.length) {
      logWarn.innerHTML = warns.join('<br>');
      logWarn.classList.remove('hidden');
    } else {
      logWarn.classList.add('hidden');
    }

    var savedNote = document.getElementById('savedNote');
    if (rep.saved) {
      savedNote.innerHTML = '<strong>Automatically saved:</strong>' +
        '<ul style="margin:6px 0 0;padding-left:20px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px">' +
        '<li>Report (open in browser): ' + esc(rep.saved.html) + '</li>' +
        '<li>Report (data): ' + esc(rep.saved.json) + '</li>' +
        '<li>Event log (SIEM/Insights): ' + esc(rep.saved.findings_log) + '</li></ul>';
      savedNote.style.background = '#e9f7ef'; savedNote.style.borderColor = '#b9e3c8';
      savedNote.classList.remove('hidden');
    } else {
      savedNote.classList.add('hidden');
    }

    var ocrNotice = document.getElementById('ocrNotice');
    var ocrFiles = (rep.stats && rep.stats.need_ocr_files) || [];
    var mailFiles = (rep.stats && rep.stats.mail_store_files) || [];
    var notices = [];
    if (ocrFiles.length) {
      notices.push('<strong>' + ocrFiles.length +
        ' document(s) were NOT searched</strong> — scans/images with no text layer (enable the OCR option, with Tesseract installed, to read them):' +
        '<ul style="margin:8px 0 0;padding-left:20px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px">' +
        ocrFiles.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>');
    }
    if (mailFiles.length) {
      notices.push('<strong>' + mailFiles.length +
        ' Outlook mail store(s) were NOT searched</strong> — mailbox files (.pst/.ost) are only opened by a targeted mail scan (tick “Mail scan” and re-run):' +
        '<ul style="margin:8px 0 0;padding-left:20px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px">' +
        mailFiles.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>');
    }
    var docFiles = (rep.stats && rep.stats.unreadable_doc_files) || [];
    if (docFiles.length) {
      notices.push('<strong>' + docFiles.length +
        ' document(s) were NOT searched</strong> — they are in formats PrivacyLens cannot open (old-style .doc/.xls/.ppt, Outlook .msg, OpenDocument). Re-save them as .docx, .xlsx, or PDF to include them:' +
        '<ul style="margin:8px 0 0;padding-left:20px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px">' +
        docFiles.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>');
    }
    var errs = (rep.stats && rep.stats.errors) || [];
    if (errs.length) {
      var shown = errs.slice(0, 20);
      notices.push('<strong>' + errs.length +
        ' file(s) could not be read</strong> - permission denied, damaged, or a format error - so their contents were NOT searched' +
        (errs.length > shown.length ? ' (first ' + shown.length + ' shown; the JSON report lists them all)' : '') + ':' +
        '<ul style="margin:8px 0 0;padding-left:20px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px">' +
        shown.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>');
    }
    if (notices.length) {
      ocrNotice.innerHTML = notices.join('<div style="margin-top:10px"></div>');
      ocrNotice.classList.remove('hidden');
    } else {
      ocrNotice.classList.add('hidden');
    }
    results.classList.remove('hidden');
    applyFilters();
  }

  function applyFilters() {
    var q = document.getElementById('search').value.toLowerCase();
    var c = catFilter.value;
    var cf = document.getElementById('confFilter').value;
    docs.querySelectorAll('.doc').forEach(function (doc) {
      var pathMatch = !q || doc.querySelector('.doc-head').textContent.toLowerCase().indexOf(q) !== -1;
      var visible = 0;
      doc.querySelectorAll('tr[data-cat]').forEach(function (tr) {
        var ok = (pathMatch || tr.textContent.toLowerCase().indexOf(q) !== -1) &&
          (!c || tr.dataset.cat === c) &&
          (!cf || (cf === 'high' ? tr.dataset.conf === 'high' : tr.dataset.conf !== 'low'));
        tr.style.display = ok ? '' : 'none';
        if (ok) visible++;
      });
      doc.style.display = visible ? '' : 'none';
    });
  }
  document.getElementById('search').addEventListener('input', applyFilters);
  catFilter.addEventListener('change', applyFilters);
  document.getElementById('confFilter').addEventListener('change', applyFilters);

  document.querySelectorAll('.downloads button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var saved = activeTab === 'history' && viewedName ? '&report=' + encodeURIComponent(viewedName) : '';
      fetch('/api/download?format=' + encodeURIComponent(btn.dataset.fmt) + saved, {
        headers: { 'X-PL-Token': TOKEN }
      }).then(function (resp) {
        if (!resp.ok) { return resp.text().then(function (t) { throw new Error(t); }); }
        var cd = resp.headers.get('Content-Disposition') || '';
        var m = /filename=([^;]+)/.exec(cd);
        return resp.blob().then(function (blob) {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = m ? m[1].replace(/[\"']/g, '') : 'privacylens-report';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        });
      }).catch(function (err) { setStatus('Download failed: ' + esc(err.message), true); });
    });
  });
})();
</script>
</body>
</html>
